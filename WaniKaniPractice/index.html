<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; connect-src 'self' https://api.wanikani.com; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src https://fonts.gstatic.com; img-src 'self'; media-src https://files.wanikani.com; base-uri 'self'; form-action 'none';" />
    <link rel="icon" type="image/svg+xml" href="assets/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&family=M+PLUS+1p&family=Noto+Sans+JP:wght@100..900&family=Noto+Serif+JP:wght@200..900&family=Shippori+Mincho+B1&family=Yuji+Syuku&family=Zen+Antique&family=Zen+Maru+Gothic&display=swap"
        rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WaniKani Vocab Practice</title>
</head>

<body>
    <script type="module" src="/src/main.js"></script>

    <header class="header">
        <h1>WaniKani Practice</h1>
        <div class="header-right">
            <img src="assets/settings.svg" alt="Settings" class="clickable-icon" height="1.5rem" id="settings-btn">
        </div>
    </header>

    <div class="setup-area" id="setup-area">
        <div class="setup-card">
            <p class="setup-tagline">Practice reading Japanese sentences<br>using your WaniKani vocabulary.</p>
            <button class="btn-primary setup-btn">Start session</button>
        </div>
        <div id="loading-indicator" class="loading-indicator hidden">
            <div class="loading-spinner"></div>
            <p>Loading vocabulary…</p>
        </div>
    </div>

    <div class="main hidden">

        <div class="hint-card" id="hint-card">
            <div class="hint-card-header">
                <div class="vocab-char-row">
                    <span class="vocab-char" id="hint-characters"></span>
                    <button class="audio-btn hidden" id="audio-btn" type="button" aria-label="Play pronunciation" title="Play pronunciation">🔊</button>
                </div>
                <div id="hint-types"></div>
            </div>
            <div class="hint-row">
                <span class="hint-label">Reading</span>
                <span class="hint-value blurred" id="hint-readings"></span>
            </div>
            <div class="hint-row">
                <span class="hint-label">Meaning</span>
                <span class="hint-value blurred" id="hint-meanings"></span>
            </div>
        </div>

        <div class="sentence-card">
            <div class="sentence-scroll">
                <div class="sentence-jp"></div>
                <div class="answer blurred">
                    <div class="sentence-kana"></div>
                    <div class="sentence-en"></div>
                </div>
            </div>
            <div class="custom-scrollbar" id="custom-scrollbar">
                <div class="custom-scrollbar-thumb" id="custom-scrollbar-thumb"></div>
            </div>
        </div>
        <div class="progress-row">
            <div class="progress-bar hidden" id="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
            <span class="progress-counter hidden" id="progress-counter">0 / 0</span>
            <span class="quiz-score hidden" id="quiz-score"></span>
        </div>

        <div class="quiz-answer-area hint-card hidden" id="quiz-answer-area">
            <div class="input-row quiz-input-row">
                <label for="quiz-reading-input">Reading</label>
                <input type="text" id="quiz-reading-input" autocomplete="off">
            </div>
            <span class="quiz-feedback" id="reading-feedback"></span>

            <div class="input-row quiz-input-row">
                <label for="quiz-meaning-input">Meaning</label>
                <input type="text" id="quiz-meaning-input" autocomplete="off">
            </div>
            <span class="quiz-feedback" id="meaning-feedback"></span>
        </div>

        <div class="btn-grid">
            <button class="btn-hint" id="hint-btn">Show hint</button>
            <button class="btn-answer" id="show-answer-btn">Show answer</button>
            <button class="btn-answer hidden" id="check-answer-btn">Check answer</button>
            <button class="btn-prev" id="prev-sentence-btn">← Previous</button>
            <button class="btn-next" id="next-sentence-btn">Next sentence →</button>
            <button class="btn-reset" id="reset-btn">Reset</button>
        </div>

    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal-overlay hidden">
        <div class="modal">
            <h3>Settings</h3>

            <div class="setting-item">
                <label for="api-token">WaniKani API token</label>
                <input type="text" id="api-token" maxlength="50" placeholder="Enter your API token">
            </div>

            <div class="setting-item">
                <label for="sentence-font">Sentence font</label>
                <select id="sentence-font"></select>
            </div>

            <div class="setting-item">
                <label for="theme-select">Theme</label>
                <select id="theme-select">
                    <option value="light">Light</option>
                    <option value="dark">Dark</option>
                    <option value="system">System</option>
                </select>
            </div>

            <div class="modal-actions">
                <button class="btn-cancel cancel-btn">Cancel</button>
                <button class="btn-save save-btn">Save</button>
            </div>
        </div>
    </div>

    <div id="start-modal" class="modal-overlay hidden">
        <div class="modal">
            <h3>New session</h3>

            <p class="modal-section-label">Mode</p>
            <div class="radio-group mode-group">
                <label class="radio-label">
                    <input type="radio" name="practice-mode" value="review" checked>
                    <span>Review</span>
                </label>
                <label class="radio-label">
                    <input type="radio" name="practice-mode" value="quiz">
                    <span>Quiz</span>
                </label>
            </div>

            <p class="modal-section-label">Vocabulary</p>
            <div class="radio-group type-group">
                <label class="radio-label">
                    <input type="radio" name="practice-type" value="levels" checked>
                    <span>Levels</span>
                </label>
                <label class="radio-label">
                    <input type="radio" name="practice-type" value="days">
                    <span>Lessons</span>
                </label>
                <label class="radio-label">
                    <input type="radio" name="practice-type" value="critical">
                    <span>Critical</span>
                </label>
            </div>

            <div class="warnings">
                <p id="start-warning" class="warning hidden"></p>
            </div>

            <div class="levels-range hidden">
                <div class="input-row">
                    <label for="from-level">From level</label>
                    <input id="from-level" class="number-input" type="number" min="1" max="60" step="1" value="1">
                </div>
                <div class="input-row">
                    <label for="to-level">To level</label>
                    <input id="to-level" class="number-input" type="number" min="1" max="60" step="1" value="5">
                </div>
            </div>

            <div class="days-range hidden">
                <div class="input-row">
                    <label for="at-date">At date</label>
                    <input type="date" id="at-date" name="at-date" />
                </div>
            </div>

            <p class="modal-section-label">Limit</p>
            <div class="input-row">
                <label for="session-limit">Max items (0 = no limit)</label>
                <input id="session-limit" class="number-input" type="number" min="0" step="1" value="25">
            </div>

            <details class="advanced-section">
                <summary>Advanced</summary>

                <label class="checkbox-label select-all-label">
                    <input type="checkbox" id="category-select-all" checked>
                    <span>Select all categories</span>
                </label>

                <p class="modal-section-label">Grammar</p>
                <div class="category-grid" id="category-checkboxes-grammar"></div>

                <p class="modal-section-label">Themes</p>
                <div class="category-grid" id="category-checkboxes-theme"></div>
            </details>

            <button id="start-btn" class="btn-primary">Start practice</button>
        </div>
    </div>

</body>

</html>
